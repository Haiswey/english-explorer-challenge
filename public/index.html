<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Explorer Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><p class="muted" style="text-align:center;margin-top:40px">Loading…</p></main>
<script>
(function () {
const IMG = 'https://cdn.jsdelivr.net/npm/openmoji@15.1.0/color/svg/';
const app = document.getElementById('app');
let QZ = null, S = null;
const ALL = () => QZ.parts.flatMap(p => p.qs.map(q => ({ ...q, part: p })));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const key = () => 'kkx-' + QZ.id + '-' + S.klass + '-' + S.name;
const save = () => { try { localStorage.setItem(key(), JSON.stringify(S)); } catch (e) {} };
const load = (k, n) => { try { return JSON.parse(localStorage.getItem('kkx-' + QZ.id + '-' + k + '-' + n) || 'null'); } catch (e) { return null; } };
function emoji(code) { return code.split('-').map(h => String.fromCodePoint(parseInt(h, 16))).join(''); }
function pic(q) {
  return '<div class="pic"><img data-src="' + IMG + q.pic + '.svg" alt="' + esc(q.alt) + '" data-emo="' + esc(emoji(q.pic)) + '"></div>';
}
function fixImgs() {
  app.querySelectorAll('img[data-emo]').forEach(img => {
    let done = false;
    const swap = () => { if (done || !img.isConnected) return; done = true; const s = document.createElement('span'); s.className = 'emo'; s.setAttribute('role', 'img'); s.setAttribute('aria-label', img.alt); s.textContent = img.dataset.emo; img.replaceWith(s); };
    img.onerror = swap;
    img.onload = () => { done = true; };
    setTimeout(() => { if (!img.complete || !img.naturalWidth) swap(); }, 4000);
    img.src = img.dataset.src;
  });
  const now = app.querySelector('.stone.now'); if (now) now.scrollIntoView({ block: 'nearest', inline: 'center' });
}
// shuffle with a seed so a pupil sees the same order after a refresh
function seeded(seedStr) { let h = 2166136261; for (const c of seedStr) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shuffleNotSame(arr, rnd) { let a; let n = 0; do { a = shuffle(arr, rnd); n++; } while (n < 8 && a.join('|') === arr.join('|')); return a; }

const compass = '<svg class="compass" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="var(--card)" stroke="var(--sea)" stroke-width="6"/><circle cx="50" cy="50" r="34" fill="none" stroke="var(--trail)" stroke-width="2" stroke-dasharray="3 5"/><path d="M50 16 L60 50 L50 84 L40 50 Z" fill="var(--sea-soft)" stroke="var(--sea)" stroke-width="3" stroke-linejoin="round"/><path d="M50 16 L60 50 L40 50 Z" fill="var(--sun)" stroke="var(--sun-edge)" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="50" r="5" fill="var(--sea)"/></svg>';

async function boot() {
  try {
    const r = await fetch('/api/quiz', { cache: 'no-store' });
    QZ = await r.json();
  } catch (e) { app.innerHTML = '<p class="err" style="text-align:center;margin-top:40px">The quiz did not load. Check the internet and refresh the page.</p>'; return; }
  homeScreen();
}

function homeScreen() {
  S = null;
  const cls = QZ.classes || [];
  app.innerHTML = '<div class="title">' + compass + '<h1>English Explorer Challenge</h1><p>' + esc(QZ.subtitle) + ' for Year 2</p></div>' +
    '<section class="panel" style="margin-top:18px"><h2 class="head" style="font-size:26px">Tap your class</h2>' +
    (cls.length ? '<div class="classes">' + cls.map(c => '<button data-c="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>'
      : '<p class="err">The class list did not load. Refresh the page.</p>') + '</section>';
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => nameScreen(b.dataset.c));
}

function nameScreen(klass) {
  app.innerHTML = '<div class="top"><button class="btn ghost" id="back">Back</button><span class="who">Class ' + esc(klass) + '</span></div>' +
    '<section class="panel" style="margin-top:16px"><label for="nm" class="head" style="font-size:26px;display:block;margin-bottom:10px">Type your name</label>' +
    '<input id="nm" class="name-in" autocomplete="off" autocapitalize="words" spellcheck="false">' +
    '<p class="muted" id="hint" style="font-size:17px;margin:8px 0 0">Type 3 letters, then tap your name.</p><div class="names" id="names"></div></section>';
  document.getElementById('back').onclick = homeScreen;
  const inp = document.getElementById('nm'), box = document.getElementById('names'), hint = document.getElementById('hint');
  let t = null, seq = 0;
  inp.focus();
  inp.oninput = () => {
    clearTimeout(t); const q = inp.value.trim();
    if (q.length < 3) { box.innerHTML = ''; hint.textContent = 'Type 3 letters, then tap your name.'; return; }
    t = setTimeout(async () => {
      const my = ++seq;
      try {
        const r = await fetch('/api/roster?klass=' + encodeURIComponent(klass) + '&q=' + encodeURIComponent(q), { cache: 'no-store' });
        const j = await r.json(); if (my !== seq) return;
        box.innerHTML = (j.names || []).map(n => '<button data-n="' + esc(n) + '">' + esc(n) + '</button>').join('');
        hint.textContent = (j.names || []).length ? 'Tap your name.' : 'No name found. Check the spelling, or ask your teacher.';
        box.querySelectorAll('[data-n]').forEach(b => b.onclick = () => pickName(klass, b.dataset.n));
      } catch (e) { hint.textContent = 'Names did not load. Check the internet.'; }
    }, 250);
  };
}

function pickName(klass, name) {
  const old = load(klass, name);
  if (old && old.qid === QZ.id) { S = old; return S.result ? doneScreen() : (S.i >= 0 ? qScreen() : readyScreen()); }
  const rnd = seeded(klass + '|' + name + '|' + QZ.id);
  const order = {}; const tiles = {};
  QZ.parts.forEach(p => {
    order[p.id] = shuffle(p.qs.map(q => q.id), rnd);
    p.qs.forEach(q => { if (q.opts) tiles[q.id] = shuffle(q.opts, rnd); else if (q.tiles) tiles[q.id] = shuffleNotSame(q.tiles, rnd); });
  });
  const seq = QZ.parts.flatMap(p => order[p.id]);
  S = { qid: QZ.id, klass, name, seq, tiles, a: {}, i: -1, startedAt: null, result: null };
  save(); readyScreen();
}

function readyScreen() {
  const n = S.seq.length;
  app.innerHTML = '<div class="title">' + compass + '<h1 style="font-size:clamp(30px,7vw,44px)">Hello, ' + esc(S.name) + '!</h1><p>Class ' + esc(S.klass) + '</p></div>' +
    '<section class="panel" style="margin-top:14px"><p style="margin:0 0 10px">There are <b>' + n + ' questions</b> in 3 parts:</p>' +
    QZ.parts.map((p, k) => '<p style="margin:6px 0">Part ' + (k + 1) + ': ' + esc(p.name) + ' <span class="muted">(' + p.qs.length + ' questions)</span></p>').join('') +
    '<p class="muted" style="margin:12px 0 0;font-size:18px">You can go back and change your answers before you submit.</p>' +
    '<div class="actions"><button class="btn ghost" id="notme">This is not me</button><button class="btn go" id="start">Start</button></div></section>';
  document.getElementById('notme').onclick = homeScreen;
  document.getElementById('start').onclick = () => { S.i = 0; S.startedAt = S.startedAt || Date.now(); save(); qScreen(); };
}

function qObj(id) { for (const p of QZ.parts) { const q = p.qs.find(x => x.id === id); if (q) return { q, p, pn: QZ.parts.indexOf(p) + 1 }; } }
function answered(id) {
  const { q, p } = qObj(id); const v = S.a[id];
  if (p.id === 'A') return !!v;
  if (p.id === 'B') return Array.isArray(v) && v.length === q.blanks.length && v.every(x => x);
  return Array.isArray(v) && v.length === q.tiles.length;
}

function trail() {
  let h = '<div class="trail" aria-label="Question ' + (S.i + 1) + ' of ' + S.seq.length + '">', prevPart = null;
  S.seq.forEach((id, k) => {
    const part = id[0];
    if (k > 0) h += prevPart !== part ? '<span class="part-gap"></span>' : '<span class="path"></span>';
    const cls = k === S.i ? 'now' : (answered(id) ? 'done' : '');
    h += '<button class="stone ' + cls + '" data-go="' + k + '" aria-label="Question ' + (k + 1) + '">' + (k + 1) + '</button>';
    prevPart = part;
  });
  return h + '</div>';
}

function qScreen() {
  const id = S.seq[S.i]; const { q, p, pn } = qObj(id);
  let body = '';
  if (p.id === 'A') {
    body = pic(q) + '<div class="opts">' + S.tiles[id].map(o => '<button class="opt" data-o="' + esc(o) + '" aria-pressed="' + (S.a[id] === o) + '">' + esc(o) + '</button>').join('') + '</div>';
  } else if (p.id === 'B') {
    const v = S.a[id] || [];
    let k = -1;
    body = pic(q) + '<div class="slots">' + q.shown.map(c => {
      if (c) return '<span class="slot fixed">' + esc(c) + '</span>';
      k++; const L = v[k] || '';
      return '<button class="slot gap' + (L ? ' filled' : '') + '" data-slot="' + k + '" aria-label="' + (L ? 'Letter ' + esc(L) + '. Tap to take it out' : 'Empty space') + '">' + esc(L) + '</button>';
    }).join('') + '</div>';
    const used = v.slice();
    body += '<div class="tiles">' + S.tiles[id].map((t, ti) => {
      const u = used.indexOf(t); if (u >= 0) used[u] = null;
      return '<button class="tile" data-tile="' + ti + '"' + (u >= 0 ? ' disabled' : '') + '>' + esc(t) + '</button>';
    }).join('') + '</div>';
  } else {
    const v = S.a[id] || [];
    const used = v.slice();
    body = pic(q) + '<div class="sentence" id="sent">' + v.map((w, wi) => '<button class="tile placed" data-back="' + wi + '" aria-label="' + esc(w) + '. Tap to take it out">' + esc(w) + '</button>').join('') + '</div>' +
      '<div class="tiles">' + S.tiles[id].map((t, ti) => {
        const u = used.indexOf(t); if (u >= 0) used[u] = null;
        return '<button class="tile" data-word="' + ti + '"' + (u >= 0 ? ' disabled' : '') + '>' + esc(t) + '</button>';
      }).join('') + '</div>';
  }
  const last = S.i === S.seq.length - 1;
  app.innerHTML = '<div class="top"><span class="who">' + esc(S.name) + ', ' + esc(S.klass) + '</span><span class="who">Question ' + (S.i + 1) + ' of ' + S.seq.length + '</span></div>' + trail() +
    '<section class="qcard"><div class="qhead"><h2>Part ' + pn + ': ' + esc(p.name) + '</h2><span class="marks">' + p.marksEach + (p.marksEach > 1 ? ' marks' : ' mark') + '</span></div>' +
    '<p class="help">' + esc(p.help) + '</p>' + body + '</section>' +
    '<div class="actions"><button class="btn ghost" id="prev"' + (S.i === 0 ? ' disabled' : '') + '>Back</button><button class="btn" id="next">' + (last ? 'Check my answers' : 'Next') + '</button></div>';
  fixImgs();
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.i = +b.dataset.go; save(); qScreen(); });
  document.getElementById('prev').onclick = () => { S.i--; save(); qScreen(); };
  document.getElementById('next').onclick = () => { if (last) { reviewScreen(); } else { S.i++; save(); qScreen(); } window.scrollTo(0, 0); };
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { S.a[id] = b.dataset.o; save(); qScreen(); });
  app.querySelectorAll('[data-tile]').forEach(b => b.onclick = () => {
    const v = (S.a[id] || Array(q.blanks.length).fill('')).slice();
    const k = v.findIndex(x => !x); if (k < 0) return;
    v[k] = S.tiles[id][+b.dataset.tile]; S.a[id] = v; save(); qScreen();
  });
  app.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => {
    const v = (S.a[id] || []).slice(); v[+b.dataset.slot] = ''; S.a[id] = v; save(); qScreen();
  });
  app.querySelectorAll('[data-word]').forEach(b => b.onclick = () => {
    const v = (S.a[id] || []).slice(); v.push(S.tiles[id][+b.dataset.word]); S.a[id] = v; save(); qScreen();
  });
  app.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
    const v = (S.a[id] || []).slice(); v.splice(+b.dataset.back, 1); S.a[id] = v; save(); qScreen();
  });
}

function reviewScreen() {
  const missing = S.seq.filter(id => !answered(id)).length;
  app.innerHTML = '<div class="title" style="padding-top:4px"><h1 style="font-size:36px">Check your answers</h1></div>' +
    '<section class="panel review">' + QZ.parts.map((p, k) => '<div><h3 class="head">Part ' + (k + 1) + ': ' + esc(p.name) + '</h3><div class="grid">' +
      S.seq.map((id, n) => id[0] === p.id ? '<button data-go="' + n + '" class="' + (answered(id) ? 'ok' : 'empty') + '" aria-label="Question ' + (n + 1) + (answered(id) ? ', answered' : ', not answered') + '">' + (n + 1) + '</button>' : '').join('') + '</div></div>').join('') +
    '<p style="margin:0">' + (missing ? '<b style="color:var(--coral)">' + missing + ' question' + (missing > 1 ? 's have' : ' has') + ' no answer.</b> Tap a red box to answer it.' : 'You answered every question.') + '</p>' +
    '<p class="err" id="err"></p><div class="actions"><button class="btn ghost" id="back">Back</button><button class="btn go" id="send">Submit my answers</button></div></section>';
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.i = +b.dataset.go; save(); qScreen(); });
  document.getElementById('back').onclick = () => qScreen();
  document.getElementById('send').onclick = async (ev) => {
    if (missing && !confirm('Some questions have no answer. Submit anyway?')) return;
    const btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const r = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: S.name, klass: S.klass, answers: S.a, startedAt: S.startedAt }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Not saved');
      S.result = j; save(); doneScreen();
    } catch (e) {
      document.getElementById('err').textContent = 'Not sent yet. Check the internet, then tap Submit again.';
      btn.disabled = false; btn.textContent = 'Submit my answers';
    }
  };
}

function doneScreen() {
  const r = S.result;
  app.innerHTML = '<div class="title">' + compass + '<h1>Well done, explorer!</h1><p>' + esc(S.name) + ', ' + esc(S.klass) + '</p></div>' +
    '<section class="panel score" style="margin-top:14px"><p style="margin:0 0 6px">Your score</p><div class="big">' + r.score + '<span style="font-size:40px;color:var(--muted)"> / ' + r.total + '</span></div>' +
    '<div class="parts">' + QZ.parts.map((p, k) => '<span>Part ' + (k + 1) + ': ' + (r.parts[p.id] || 0) + ' / ' + p.qs.length * p.marksEach + '</span>').join('') + '</div>' +
    '<p class="muted" style="margin:18px 0 0;font-size:18px">Your answers have been sent to your teacher.</p>' +
    '<div class="actions" style="justify-content:center"><button class="btn ghost" id="another">Next pupil on this device</button></div></section>';
  document.getElementById('another').onclick = homeScreen;
}

boot();
})();
</script>
</body>
</html>
