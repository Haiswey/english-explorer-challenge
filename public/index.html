  });
  app.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => {
    const v = (S.a[id] || []).slice(); v[+b.dataset.slot] = ''; S.a[id] = v; save(); qScreen();
  });
  app.querySelectorAll('[data-word]').forEach(b => b.onclick = () => {
    const v = (S.a[id] || []).slice(); v.push(S.tiles[id][+b.dataset.word]); S.a[id] = v; save(); qScreen();
  });
  app.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
    const v = (S.a[id] || []).slice(); v.splice(+b.dataset.back, 1); S.a[id] = v; save(); qScreen();
  });
}

function reviewScreen() {
  const missing = S.seq.filter(id => !answered(id)).length;
  app.innerHTML = '<div class="title" style="padding-top:4px"><h1 style="font-size:36px">Check your answers</h1></div>' +
    '<section class="panel review">' + QZ.parts.map((p, k) => '<div><h3 class="head">Part ' + (k + 1) + ': ' + esc(p.name) + '</h3><div class="grid">' +
      S.seq.map((id, n) => id[0] === p.id ? '<button data-go="' + n + '" class="' + (answered(id) ? 'ok' : 'empty') + '" aria-label="Question ' + (n + 1) + (answered(id) ? ', answered' : ', not answered') + '">' + (n + 1) + '</button>' : '').join('') + '</div></div>').join('') +
    '<p style="margin:0">' + (missing ? '<b style="color:var(--coral)">' + missing + ' question' + (missing > 1 ? 's have' : ' has') + ' no answer.</b> Tap a red box to answer it.' : 'You answered every question.') + '</p>' +
    '<p class="err" id="err"></p><div class="actions"><button class="btn ghost" id="back">Back</button><button class="btn go" id="send">Submit my answers</button></div></section>';
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.i = +b.dataset.go; save(); qScreen(); });
  document.getElementById('back').onclick = () => qScreen();
  document.getElementById('send').onclick = async (ev) => {
    if (missing && !confirm('Some questions have no answer. Submit anyway?')) return;
    const btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const r = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: S.name, klass: S.klass, answers: S.a, startedAt: S.startedAt }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Not saved');
      S.result = j; save(); doneScreen();
    } catch (e) {
      document.getElementById('err').textContent = 'Not sent yet. Check the internet, then tap Submit again.';
      btn.disabled = false; btn.textContent = 'Submit my answers';
    }
  };
}

function doneScreen() {
  const r = S.result;
  app.innerHTML = '<div class="title">' + compass + '<h1>Well done, explorer!</h1><p>' + esc(S.name) + ', ' + esc(S.klass) + '</p></div>' +
    '<section class="panel score" style="margin-top:14px"><p style="margin:0 0 6px">Your score</p><div class="big">' + r.score + '<span style="font-size:40px;color:var(--muted)"> / ' + r.total + '</span></div>' +
    '<div class="parts">' + QZ.parts.map((p, k) => '<span>Part ' + (k + 1) + ': ' + (r.parts[p.id] || 0) + ' / ' + p.qs.length * p.marksEach + '</span>').join('') + '</div>' +
    '<p class="muted" style="margin:18px 0 0;font-size:18px">Your answers have been sent to your teacher.</p>' +
    '<div class="actions" style="justify-content:center"><button class="btn ghost" id="another">Next pupil on this device</button></div></section>';
  document.getElementById('another').onclick = homeScreen;
}

boot();
})();
</script>
</body>
</html>
